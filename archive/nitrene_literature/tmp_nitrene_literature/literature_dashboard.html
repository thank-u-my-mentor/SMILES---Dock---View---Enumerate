tentially generalizable to installation of other functional groups, provided that the corresponding anions can support the four requisite steps. We show here that the wild-type halogenase SyrB2 can indeed direct aliphatic nitration and azidation reactions by the same chemical logic. The discovery and enhancement by mutagenesis of these previously unknown reaction types suggests unrecognized or untapped versatility in ferryl-mediated enzymatic C–H-bond activation.", "enzyme_family": "halogenase", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "radical chemical reaction", "reaction_type": "decarboxylative coupling", "mechanism": "HAT", "bond": "C-X", "substrate": "other", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "137", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Direct nitration and azidation of aliphatic carbons by an ir...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1021_ja503593n", "title": "Enantioselective Imidation of Sulfides via Enzyme-Catalyzed Intermolecular Nitrogen-Atom Transfer", "authors": "Christopher C. Farwell, J. McIntosh, T. Hyster et al.", "year": 2014, "doi": "10.1021/ja503593n", "journal": "Journal of the American Chemical Society", "url": "https://doi.org/10.1021/ja503593n", "abstract": "Engineering enzymes with novel reaction modes promises to expand the applications of biocatalysis in chemical synthesis and will enhance our understanding of how enzymes acquire new functions. The insertion of nitrogen-containing functional groups into unactivated C–H bonds is not catalyzed by known enzymes but was recently demonstrated using engineered variants of cytochrome P450BM3 (CYP102A1) from Bacillus megaterium. Here, we extend this novel P450-catalyzed reaction to include intermolecular insertion of nitrogen into thioethers to form sulfimides. An examination of the reactivity of different P450BM3 variants toward a range of substrates demonstrates that electronic properties of the substrates are important in this novel enzyme-catalyzed reaction. Moreover, amino acid substitutions have a large effect on the rate and stereoselectivity of sulfimidation, demonstrating that the protein plays a key role in determining reactivity and selectivity. These results provide a stepping stone for engineering more complex nitrogen-atom-transfer reactions in P450 enzymes and developing a more comprehensive biocatalytic repertoire.", "enzyme_family": "P450", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "C-O | C-S", "substrate": "amine | amino acid derivative", "opportunity": "medium", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "122", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Enantioselective Imidation of Sulfides via Enzyme-Catalyzed ...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1016_j_bmc_2014_05_015", "title": "Intramolecular C(sp3)—H amination of arylsulfonyl azides with engineered and artificial myoglobin-based catalysts", "authors": "Mélanie Bordeaux, Ritesh Singh, R. Fasan", "year": 2014, "doi": "10.1016/j.bmc.2014.05.015", "journal": "Bioorganic & Medicinal Chemistry", "url": "https://doi.org/10.1016/j.bmc.2014.05.015", "abstract": "The direct conversion of aliphatic C—H bonds into C—N bonds provides an attractive approach to the introduction of nitrogen-containing functionalities in organic molecules. Following our recent discovery that cytochrome P450 enzymes can catalyze the cyclization of arylsulfonyl azide compounds via an intramolecular C(sp3)—H amination reaction, we have explored here the C—H amination reactivity of other hemoproteins. Various heme-containing proteins, and in particular myoglobin and horseradish peroxidase, were found to be capable of catalyzing this transformation. Based on this finding, a series of engineered and artificial myoglobin variants containing active site mutations and non-native Mn- and Co-protoporphyrin IX cofactors, respectively, were preparedWmvestigate the effect of these structural changes on the catalytic activity and selectivity of to these catalysts. Our studies showed that metallo-substituted myoglobins constitute viable C—H amination catalysts, revealing a distinctive reactivity trend as compared to synthetic metalloporphyrin counterparts. On the other hand, amino acid substitutions at the level of the heme pocket were found to be beneficial toward improving the stereo- and enantioselectivity of these Mb-catalyzed reactions. Mechanistic studies involving kinetic isotope effect experiments indicate that C—H bond cleavage is implicated in the rate-limiting step of myoglobin-catalyzed amination of arylsulfonyl azides. Altogether, these studies indicate that myoglobin constitutes a promising scaffold for the design and development of C— H amination catalysts.", "enzyme_family": "P450", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "cyclization", "mechanism": "HAT", "bond": "C-O", "substrate": "arene | amine | amino acid derivative", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "111", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Intramolecular C(sp3)—H amination of arylsulfonyl azides wit...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1002_cbic_201400060", "title": "Enhancing the Efficiency and Regioselectivity of P450 Oxidation Catalysts via Unnatural Amino Acid Mutagenesis", "authors": "Joshua N. Kolev, Jacqueline M. Zaengle, R. Ravikumar et al.", "year": 2014, "doi": "10.1002/cbic.201400060", "journal": "ChemBioChem", "url": "https://doi.org/10.1002/cbic.201400060", "abstract": "The development of effective strategies for modulating the reactivity and selectivity of cytochrome P450 enzymes represents a key step toward expediting the use of these biocatalysts for synthetic applications. We have investigated the potential of unnatural amino acid mutagenesis to aid efforts in this direction. Four unnatural amino acids with diverse aromatic side chains were incorporated at 11 active‐site positions of a substrate‐promiscuous CYP102A1 variant. The resulting “uP450s” were then tested for their catalytic activity and regioselectivity in the oxidation of two representative substrates: a small‐molecule drug and a natural product. Large shifts in regioselectivity resulted from these single mutations, and in particular, for para‐acetyl‐Phe substitutions at positions close to the heme cofactor. Screening this mini library of uP450s enabled us to identify P450 catalysts for the selective hydroxylation of four aliphatic positions in the target substrates, including a C(sp3)H site not oxidized by the parent enzyme. Furthermore, we discovered a general activity‐enhancing effect of active‐site substitutions involving the unnatural amino acid para‐amino‐Phe, which resulted in P450 catalysts capable of supporting the highest total turnover number reported to date on a complex molecule (34 650). The functional changes induced by the unnatural amino acids could not be reproduced by any of the 20 natural amino acids. This study thus demonstrates that unnatural amino acid mutagenesis constitutes a promising new strategy for improving the catalytic activity and regioselectivity of P450 oxidation catalysts.", "enzyme_family": "P450", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "C-O", "substrate": "arene | amine | drug-like molecule | amino acid derivative", "opportunity": "medium", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "73", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Enhancing the Efficiency and Regioselectivity of P450 Oxidat...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1021_jacs_2c08285", "title": "Enzymatic Nitrogen Insertion into Unactivated C–H Bonds", "authors": "S. Athavale, Shi-Chao Gao, Anuvab Das et al.", "year": 2022, "doi": "10.1021/jacs.2c08285", "journal": "Journal of the American Chemical Society", "url": "https://doi.org/10.1021/jacs.2c08285", "abstract": "Selective functionalization of aliphatic C–H bonds, ubiquitous in molecular structures, could allow ready access to diverse chemical products. While enzymatic oxygenation of C–H bonds is well established, the analogous enzymatic nitrogen functionalization is still unknown; nature is reliant on pre-oxidized compounds for nitrogen incorporation. Likewise, synthetic methods for selective nitrogen derivatization of unbiased C–H bonds remain elusive. In this work, new-to-nature heme-containing nitrene transferases were used as starting points for the directed evolution of enzymes to selectively aminate and amidate unactivated C(sp3)–H sites. The desymmetrization of methyl- and ethylcyclohexane with divergent site selectivity is offered as demonstration. The evolved enzymes in these lineages are highly promiscuous and show activity towards a wide array of substrates, providing a foundation for further evolution of nitrene transferase function. Computational studies and kinetic isotope effects (KIEs) are consistent with a stepwise radical pathway involving an irreversible, enantiodetermining hydrogen atom transfer (HAT), followed by a lower-barrier diastereoselectivity determining radical rebound step. In-enzyme molecular dynamics (MD) simulations reveal a predominantly hydrophobic pocket with favorable dispersion interactions with the substrate. By offering a direct path from saturated precursors, these enzymes present a new biochemical logic for accessing nitrogen-containing compounds.", "enzyme_family": "transferase", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "radical chemical reaction", "reaction_type": "C-H functionalization", "mechanism": "HAT", "bond": "C-N", "substrate": "other", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "56", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Enzymatic Nitrogen Insertion into Unactivated C–H Bonds...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1002_cbic_201402241", "title": "Structural, Functional, and Spectroscopic Characterization of the Substrate Scope of the Novel Nitrating Cytochrome P450 TxtE", "authors": "Sheel C. Dodani, Jackson K. B. Cahn, T. Heinisch et al.", "year": 2014, "doi": "10.1002/cbic.201402241", "journal": "ChemBioChem", "url": "https://doi.org/10.1002/cbic.201402241", "abstract": "A novel cytochrome P450 enzyme, TxtE, was recently shown to catalyze the direct aromatic nitration of L‐tryptophan. This unique chemistry inspired us to ask whether TxtE could serve as a platform for engineering new nitration biocatalysts to replace current harsh synthetic methods. As a first step toward this goal, and to better understand the wild‐type enzyme, we obtained high‐resolution structures of TxtE in its substrate‐free and substrate‐bound forms. We also screened a library of substrate analogues for spectroscopic indicators of binding and for production of nitrated products. From these results, we found that the wild‐type enzyme accepts moderate decoration of the indole ring, but the amino acid moiety is crucial for binding and correct positioning of the substrate and therefore less amenable to modification. A nitrogen atom is essential for catalysis, and a carbonyl must be present to recruit the αB′1 helix of the protein to seal the binding pocket.", "enzyme_family": "P450", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "C-O", "substrate": "arene | amine | carbonyl compound | amino acid derivative", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "46", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Structural, Functional, and Spectroscopic Characterization o...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1021_jacs_3c05258", "title": "Regio- and Enantioselective Catalytic δ-C-H Amidation of Dioxazolones Enabled by Open-Shell Copper-Nitrenoid Transfer.", "authors": "Suhyeon Kim, Se Lin Song, Jianbo Zhang et al.", "year": 2023, "doi": "10.1021/jacs.3c05258", "journal": "Journal of the American Chemical Society", "url": "https://doi.org/10.1021/jacs.3c05258", "abstract": "Controlling regio- and enantioselectivity in C-H functionalization reactions is of paramount importance due to their versatile synthetic utilities. Herein, we describe a new approach for the asymmetric δ-C(sp3)-H amidation catalysis of dioxazolones using a Cu(I) precursor with a chiral bisoxazoline ligand to access six-membered lactams with high to excellent regio- and enantioselectivity (up to >19:1 rr and >99:1 er). Combined experimental and computational mechanistic studies unveiled that the open-shell character of the postulated Cu-nitrenoids enables the regioselective hydrogen atom abstraction and subsequent enantio-determining radical rebound of the resulting carbon radical intermediates. The synthetic utility of this asymmetric cyclization was demonstrated in the diastereoselective introduction of additional functional groups into the chiral δ-lactam skeleton as well as in the rapid access to biorelevant azacyclic compounds.", "enzyme_family": "no enzyme", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "radical chemical reaction", "reaction_type": "cyclization", "mechanism": "HAT", "bond": "C-N | C-H", "substrate": "other", "opportunity": "medium", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "28", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Regio- and Enantioselective Catalytic δ-C-H Amidation of Dio...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1002_anie_202218577", "title": "Chiral Iron Porphyrins Catalyze Enantioselective Intramolecular C(sp3)-H Bond Amination Upon Visible-Light Irradiation.", "authors": "Hua-hua Wang, Hui Shao, Guang-Chao Huang et al.", "year": 2023, "doi": "10.1002/anie.202218577", "journal": "Angewandte Chemie", "url": "https://doi.org/10.1002/anie.202218577", "abstract": "Iron-catalyzed asymmetric amination of C(sp3)-H bonds is appealing for synthetic applications due to the biocompatibility and high earth abundance of iron, but examples of such reactions are sparse. Herein we describe chiral iron complexes of meso- or β-substituted-porphyrins that can catalyze asymmetric intramolecular C(sp3)-H amination of aryl and arylsulfonyl azides to afford chiral indolines (29 examples) and benzofused cyclic sulfonamides (17 examples) with up to 93% ee (yield: up to 99%) upon 410 nm LED light irradiation under mild conditions. Mechanistic studies including DFT calculations for the reactions of arylsulfonyl azides reveal that the Fe(NSO2Ar) intermediate generated in situ under photochemical conditions reacts with the C(sp3)-H bond through a stepwise hydrogen atom transfer/radical rebound mechanism, with enantioselectivity arising from cooperative noncovalent interactions between the Fe(NSO2Ar) unit and the peripheral substituents of the chiral porphyrin scaffold.", "enzyme_family": "no enzyme", "paper_domain": "organic photoredox/radical no-enzyme", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "radical chemical reaction", "reaction_type": "other", "mechanism": "HAT", "bond": "C-N | C-H", "substrate": "arene | sulfonamide", "opportunity": "medium", "hydrolase_relevance": "no obvious relevance", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "27", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Chiral Iron Porphyrins Catalyze Enantioselective Intramolecu...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1021_jacs_3c03587", "title": "Aspartyl β-Turn-Based Dirhodium(II) Metallopeptides for Benzylic C(sp3)–H Amination: Enantioselectivity and X-Ray Structural Analysis", "authors": "Naudin van den Heuvel, Savannah M Mason, B. Mercado et al.", "year": 2023, "doi": "10.1021/jacs.3c03587", "journal": "Journal of the American Chemical Society", "url": "https://doi.org/10.1021/jacs.3c03587", "abstract": "Amination of C(sp3)–H bonds is a powerful tool to introduce nitrogen into complex organic frameworks in a direct manner. Despite significant advances in catalyst design, full site- and enantiocontrol in complex molecular regimes remain elusive using established catalyst systems. To address these challenges, we herein describe a new class of peptide-based dirhodium(II) complexes derived from aspartic acid-containing β-turn-forming tetramers. This highly modular system can serve as a platform for the rapid generation of new chiral dirhodium(II) catalyst libraries, as illustrated by the facile synthesis of a series of 38 catalysts. Critically, we present the first crystal structure of a dirhodium(II) tetra-aspartate complex, which unveils retention of the β-turn confirmation of the peptidyl ligand; a well-defined hydrogen bonding network is evident, along with a nearly C4 symmetry that renders the rhodium centers inequivalent. The utility of this catalyst platform is illustrated by the enantioselective amination of benzylic C(sp3)–H bonds, in which state-of-the-art levels of enantioselectivity up to 95.5:4.5 er are obtained, even for substrates that present challenges with previously reported catalyst systems. Additionally, we found these complexes to be competent catalysts for the intermolecular amination of N-alkylamides via insertion into the C(sp3)–H bond α to the amide nitrogen, yielding differentially protected 1,1-diamines. Of note, this type of insertion was also observed to occur on the amide functionalities of the catalyst itself in absence of substrate, but did not appear to be detrimental to reaction outcomes when substrate was present.", "enzyme_family": "no enzyme", "paper_domain": "organic photoredox/radical no-enzyme", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "C-N", "substrate": "amine | amino acid derivative", "opportunity": "medium", "hydrolase_relevance": "no obvious relevance", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "17", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Aspartyl β-Turn-Based Dirhodium(II) Metallopeptides for Benz...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_3390_ijms26052161", "title": "Structure–Function Analysis of the Self-Sufficient CYP102 Family Provides New Insights into Their Biochemistry", "authors": "Tiara Padayachee, David C Lamb, David R. Nelson et al.", "year": 2025, "doi": "10.3390/ijms26052161", "journal": "International Journal of Molecular Sciences", "url": "https://doi.org/10.3390/ijms26052161", "abstract": "Cytochromes P450 are a superfamily of heme-containing monooxygenases involved in a variety of oxidative metabolic reactions, primarily catalyzing the insertion of an oxygen atom into a C-H bond. CYP102 represents the first example of a bacterial P450 that can be classified as a type II (eukaryotic-like) P450 and functions as a catalytically self-sufficient enzyme. These unique features have made CYP102 an attractive system for studying P450 structure and function. However, an overall picture of the specific amino acid residues that are crucial to the functioning of CYP102 and the effect of mutations on the P450 structure and catalysis is yet to be reported. Such an approach will aid protein engineering approaches used to improve this enzyme. To address this research knowledge gap, we have investigated 105 CYP102 crystal structures in this study. We demonstrate that the CYP102 active site is highly dynamic and flexible. Amino acid residues that play critical roles in substrate binding, orientation, and anchoring were identified. Mutational studies highlighted the roles of amino acids and provided possible bioengineering improvement strategies for CYP102. Decoy molecules are a promising agent for deceiving CYP102 and permitting non-native substrates into the active site. Ru(II)-diimine photosensitizers and zinc/cobalt (III) sepulchrate (Co(III)Sep) could be used as alternative electron sources. The present study serves as a reference for understanding the structure–functional analysis of CYP102 family members precisely and of P450 enzymes in general. Significantly, this work contributes to the effort to develop an improved CYP102 enzyme, thereby advancing the field of P450 research and potentially leading to new industrial applications.", "enzyme_family": "P450", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "C-H", "substrate": "amine | imine | amino acid derivative", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "5", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Structure–Function Analysis of the Self-Sufficient CYP102 Fa...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1002_anie_202524718", "title": "Nonheme Fe Enzyme‐Catalyzed Enantiodivergent Nitrogen Migration: Directed Evolution and Computational Study of Isopenicillin N Synthases for Biocatalytic Synthesis of Arylglycines", "authors": "Ken Lin, Liu-Peng Zhao, Shengchun Wang et al.", "year": 2025, "doi": "10.1002/anie.202524718", "journal": "Angewandte Chemie", "url": "https://doi.org/10.1002/anie.202524718", "abstract": "Abstract We describe the reprogramming and directed evolution of nonheme Fe enzyme isopenicillin N synthase (IPNS) as an efficient biocatalyst for 1,3‐nitrogen migration reactions via an unnatural mechanism. Directed evolution of isopenicillin N synthase from Emericella nidulans furnished a quadruple mutant (EniIPNS V185L I187V S102I R279H, IPNSNim), enabling the conversion of a range of azanyl esters into N‐protected l‐arylglycines. IPNSNim achieved a TTN of 16 000 and a TOF of 1200 min−1. This TTN surpassed state‐of‐the‐art small‐molecule Fe catalysts by 330‐fold and represented the highest TTN value reported for a nonheme Fe enzyme in a new‐to‐nature reaction. IPNSNim and our previously evolved ACCONim (ACCO: 1‐aminocyclopropane‐1‐carboxylic acid oxidase) exhibited complementary enantiopreference, allowing enantioselective synthesis of either l‐ or d‐arylglycines—essential building blocks in clinically important peptide therapeutics. Mechanistic studies revealed a biocatalyst‐controlled switch in the rate‐determining step (RDS): While the hydrogen atom transfer (HAT) step is the RDS for ACCONim‐catalyzed nitrogen migration, it is likely not with IPNSNim. Moreover, while ACCONim exhibits almost no enantioselectivity in this HAT step, IPNSNim confers excellent enantiocontrol over HAT. Computational studies using density functional theory calculations and molecular dynamics simulations suggested that IPNS and ACCO adopt two different substrate binding modes. Classical MD simulations shed light on important interactions between the substrate and active‐site residues that control the substrate binding mode and enantioselectivity.", "enzyme_family": "synthase", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "rearrangement/migration", "mechanism": "HAT", "bond": "unclear", "substrate": "arene | carboxylic acid | amine | amino acid derivative | lipid/ester", "opportunity": "medium", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "3", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Nonheme Fe Enzyme‐Catalyzed Enantiodivergent Nitrogen Migrat...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1021_jacs_5c11008", "title": "Biocatalytic Synthesis of N-Protected α-Amino Acids through 1,3-Nitrogen Migration by Nonheme Iron Enzymes.", "authors": "Teng Yuan, Mengxi Zhang, Linqi Cheng et al.", "year": 2025, "doi": "10.1021/jacs.5c11008", "journal": "Journal of the American Chemical Society", "url": "https://doi.org/10.1021/jacs.5c11008", "abstract": "Nonheme iron enzymes rank among nature's most versatile catalysts for molecular functionalization. Their flexible coordination environments provide a unique platform for expanding the scope of new-to-nature metalloenzymatic catalysis. Leveraging this feature, we herein present a novel biocatalytic strategy for synthesizing N-protected α-amino acids via 1,3-nitrogen migration. Specifically, we demonstrate that the nonheme iron enzyme isopenicillin N synthase (IPNS) from Aspergillus nidulans generates an iron-nitrene intermediate capable of aminating benzylic and allylic α-C-H bonds of carboxylic acids. Directed evolution has been performed to optimize the IPNS variant to accommodate a broad range of azanyl esters, yielding α-amino acids (24 examples) with up to 92% yield, 1477 total turnover number (TTN), and 99% enantiomeric excess (ee).", "enzyme_family": "synthase", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "rearrangement/migration", "mechanism": "HAT", "bond": "C-H", "substrate": "carboxylic acid | amine | amino acid derivative | lipid/ester", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "3", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Biocatalytic Synthesis of N-Protected α-Amino Acids through ...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_3390_molecules30204065", "title": "Expanding the Terpene Universe: Synthetic Biology and Non-Natural Chemistry in Engineered Microorganisms", "authors": "Yueli Hu, Ziyan Yuan, Qian Wang et al.", "year": 2025, "doi": "10.3390/molecules30204065", "journal": "Molecules", "url": "https://doi.org/10.3390/molecules30204065", "abstract": "Terpenes, representing one of the most extensive classes of natural products, hold significant value in the fields of pharmaceuticals, fragrances, and biofuels. Extracting these compounds from natural sources is often environmentally unsustainable, and the structural diversity found in nature is inherently limited. Metabolic engineering using microbial hosts offers a scalable and sustainable alternative, utilizing optimized biosynthetic pathways—such as the mevalonate (MVA) and the methylerythritol phosphate (MEP) pathways—to achieve high-yield production of natural terpene scaffolds. This review focuses on the various strategies in developing microbial cell factories, ranging from enhancing precursor supply to optimizing terpene synthase systems. A new and promising frontier is the increase in structural diversity of terpenes by integration of non-biological chemical transformations into engineered biosynthetic pathways. We discuss the use of artificial metalloenzymes such as engineered cytochrome P450 variants that catalyze non-natural carbene transfer reactions (cyclopropanation). The merging of synthetic biology and synthetic chemistry goes beyond the normal synthesizing capabilities found in nature, which may pave the way for the design of “non-natural” terpenoids that contain new additions and better capabilities.", "enzyme_family": "P450", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "unclear", "substrate": "drug-like molecule", "opportunity": "medium", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "1", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Expanding the Terpene Universe: Synthetic Biology and Non-Na...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1002_anie_202512156", "title": "Metabolic Engineering of the 5‐Aminolevulinate Biosynthetic Pathway in E. coli Improves Efficiency of Hemoprotein‐Based Biocatalysis", "authors": "Shunsuke Kato, Miteki Abe, Nobuyuki Okahashi et al.", "year": 2025, "doi": "10.1002/anie.202512156", "journal": "Angewandte Chemie", "url": "https://doi.org/10.1002/anie.202512156", "abstract": "Abstract Biocatalysis using heme‐dependent enzymes provides a powerful synthetic platform to facilitate a variety of chemical transformations required for organic synthesis. Despite recent advances in biocatalysis, recombinant expression systems for hemoproteins leave much room for improvement due to the strict regulation of heme biosynthesis in the host organism. To develop an efficient cofactor supplementation system for the expression of active holohemoproteins, we describe metabolic engineering of the heme biosynthetic pathway in E. coli. Through incorporation of a heterogeneous C4 pathway involving 5‐aminolevulinic acid synthase of Paracoccus denitrificans, it was found that the concentrations of 5‐aminolevulinic acid and heme in the engineered cells are increased during cultivation, and the expression level of the holohemoproteins is significantly improved. Notably, the heme content in the engineered cells is even higher than that produced by conventional cultivation methods, which add 5‐aminolevulinic acid into the culture medium. Furthermore, we also demonstrate the application of this engineered E. coli cells in whole‐cell and lysate‐based biocatalysis using various types of heme‐dependent enzymes. Considering the recent demand for biocatalysis, the system developed in this study will serve as a new practical and versatile platform for hemoprotein‐based biocatalysis.", "enzyme_family": "synthase", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "unclear", "substrate": "amine", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "1", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Metabolic Engineering of the 5‐Aminolevulinate Biosynthetic ...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_21203_rs_3_rs-9204910_v1", "title": "Biocatalytic Radical C(sp3)–N Coupling via Active Site Templating", "authors": "Zayed Alassad, T. Hyster", "year": 2026, "doi": "10.21203/rs.3.rs-9204910/v1", "journal": "Research Square", "url": "https://doi.org/10.21203/rs.3.rs-9204910/v1", "abstract": "Summary Paragraph Stereoselective nucleophilic substitution to access α-tertiary amines relies on copper-catalyzed radical approaches in which the substitution is mediated by metal–anilide coordination.1 These systems, however, are constrained by competing arene radical alkylation pathways.2 Here we report a distinct photoenzymatic mechanism for enantioconvergent nucleophilic substitution that operates without metal coordination to the nucleophile. Six rounds of protein engineering yielded a variant of a flavin-dependent oxidoreductase that promotes C(sp3)–N coupling between tertiary alkyl halides and simple anilines in good yields, with high chemoselectivity for N- over C-alkylation and high enantioselectivity across a broad substrate range. Multivariate statistical analysis, density functional theory, and mechanistic experiments show that the active site templates π-stacking, hydrogen-bonding, and water-bridged interactions between a tertiary radical and the aniline lone pair to generate an intermolecular n→SOMO hyperconjugative complex that is energetically disfavored in bulk solution, thereby simultaneously lowering the radical oxidation potential and suppressing arene addition.3 This work uncovers a previously inaccessible, copper-free manifold for nucleophilic substitution at sterically congested carbon centers and expands how enzymes can catalyze C(sp3)–N bond formation with control over both stereo- and chemoselectivity.", "enzyme_family": "reductase", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "photoenzymatic radical", "reaction_type": "alkylation", "mechanism": "HAT", "bond": "C-N", "substrate": "arene | amine | alkyl halide", "opportunity": "medium", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "high", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "0", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Biocatalytic Radical C(sp3)–N Coupling via Active Site Templ...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1002_anie_201902576", "title": "Nickel-Catalyzed Asymmetric Hydrogenation of N-Sulfonyl Imines.", "authors": "Bowen Li, Jianzhong Chen, Zhenfeng Zhang et al.", "year": 2019, "doi": "10.1002/anie.201902576", "journal": "Angewandte Chemie", "url": "https://doi.org/10.1002/anie.201902576", "abstract": "An efficient nickel-catalyzed asymmetric hydrogenation of N-tBu-sulfonyl imines was developed with excellent yields and enantioselectivities using (R,R)-QuinoxP* as a chiral ligand. The use of a much lower catalyst loading (0.0095 mol %, S/C=10500) represents the highest catalytic activity for the Ni-catalyzed asymmetric hydrogenations reported so far. Mechanistic studies suggest that a coordination equilibrium exists between the nickel salt and its complex, and that excess nickel salt promotes the formation of the active Ni-complex, and therefore improved the efficiency of the hydrogenation. The catalytic cycle was also investigated by calculations to determine the origin of the enantioselectivity. An extensive network of numerous weak attractive interactions was found to exist between the catalyst and substrate in the transition state and may also contribute to the high catalytic activity.", "enzyme_family": "no enzyme", "paper_domain": "organic photoredox/radical no-enzyme", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "unclear", "substrate": "imine", "opportunity": "medium", "hydrolase_relevance": "no obvious relevance", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "0.83", "citation_count": "114", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Nickel-Catalyzed Asymmetric Hydrogenation of N-Sulfonyl Imin...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1146_annurev-biochem-061516-044724", "title": "2-Oxoglutarate-Dependent Oxygenases.", "authors": "Md. Saiful Islam, T. Leissing, R. Chowdhury et al.", "year": 2018, "doi": "10.1146/annurev-biochem-061516-044724", "journal": "Annual Review of Biochemistry", "url": "https://doi.org/10.1146/annurev-biochem-061516-044724", "abstract": "2-Oxoglutarate (2OG)-dependent oxygenases (2OGXs) catalyze a remarkably diverse range of oxidative reactions. In animals, these comprise hydroxylations and N-demethylations proceeding via hydroxylation; in plants and microbes, they catalyze a wider range including ring formations, rearrangements, desaturations, and halogenations. The catalytic flexibility of 2OGXs is reflected in their biological functions. After pioneering work identified the roles of 2OGXs in collagen biosynthesis, research revealed they also function in plant and animal development, transcriptional regulation, nucleic acid modification/repair, fatty acid metabolism, and secondary metabolite biosynthesis, including of medicinally important antibiotics. In plants, 2OGXs are important agrochemical targets and catalyze herbicide degradation. Human 2OGXs, particularly those regulating transcription, are current therapeutic targets for anemia and cancer. Here, we give an overview of the biochemistry of 2OGXs, providing examples linking to biological function, and outline how knowledge of their enzymology is being exploited in medicine, agrochemistry, and biocatalysis.", "enzyme_family": "oxygenase", "paper_domain": "enzymatic non-photo", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "halogenation", "mechanism": "unclear", "bond": "C-O | C-X", "substrate": "lipid/ester", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "0.58", "citation_count": "408", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: 2-Oxoglutarate-Dependent Oxygenases....", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1126_science_adh8753", "title": "Mechanistic snapshots of rhodium-catalyzed acylnitrene transfer reactions", "authors": "Hoimin Jung, J. Kweon, Jong-Min Suh et al.", "year": 2023, "doi": "10.1126/science.adh8753", "journal": "Science", "url": "https://doi.org/10.1126/science.adh8753", "abstract": "Rhodium (Rh) acylnitrene complexes are widely implicated in catalytic C–H amidation reactions but have eluded isolation and structural characterization. To overcome this challenge, we designed a chromophoric octahedral Rh complex with a bidentate dioxazolone ligand, in which photoinduced metal-to-ligand charge transfer initiates catalytic C–H amidation. X-ray photocrystallographic analysis of the Rh-dioxazolone complex allowed structural elucidation of the targeted Rh-acylnitrenoid and provided firm evidence that the singlet nitrenoid species is primarily responsible for acylamino transfer reactions. We also monitored in crystallo reaction of a nucleophile with the in situ–generated Rh-acylnitrenoid, which provided a crystallographically traceable reaction system to capture mechanistic snapshots of nitrenoid transfer. Description Editor’s summary Nitrenes are highly reactive chemical intermediates that are widely implicated in the formation of carbon–nitrogen bonds. Electron-deficient nitrenes, in which a nitrogen atom is bonded solely to an acyl (RC=O) group, have proven especially hard to glimpse. Jung et al. report crystallographic characterization of this acyl nitrene motif coordinated to a rhodium catalyst. The authors were able to access this by tethering a ligand to a precursor that expelled carbon dioxide upon photoexcitation, leaving the nitrene exposed. A reaction with acetone observed in the crystal validated the expected reactivity pattern. —Jake S. Yeston A long-postulated intermediate in carbon–nitrogen bond-forming catalysis has been observed crystallographically.", "enzyme_family": "no enzyme", "paper_domain": "organic photoredox/radical no-enzyme", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "photoredox radical reaction", "reaction_type": "other", "mechanism": "HAT", "bond": "C-N | C-O", "substrate": "amine", "opportunity": "unclear", "hydrolase_relevance": "no obvious relevance", "review_priority": "low", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "0.58", "citation_count": "61", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Mechanistic snapshots of rhodium-catalyzed acylnitrene trans...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1021_jacs_8b13906", "title": "Repurposing Nonheme Iron Hydroxylases To Enable Catalytic Nitrile Installation through an Azido Group Assistance.", "authors": "M. Davidson, M. McNamee, Ruixi Fan et al.", "year": 2019, "doi": "10.1021/jacs.8b13906", "journal": "Journal of the American Chemical Society", "url": "https://doi.org/10.1021/jacs.8b13906", "abstract": "Three mononuclear nonheme iron and 2-oxoglutarate dependent enzymes, l-Ile 4-hydroxylase, l-Leu 5-hydroxylase and polyoxin dihydroxylase, are previously reported to catalyze the hydroxylation of l-isoleucine, l-leucine, and l-α-amino-δ-carbamoylhydroxyvaleric acid (ACV). In this study, we showed that these enzymes can accommodate leucine isomers and catalyze regiospecific hydroxylation. On the basis of these results, as a proof-of-concept, we demonstrated that the outcome of the reaction can be redirected by installation of an assisting group within the substrate. Specifically, instead of canonical hydroxylation, these enzymes can catalyze non-native nitrile group installation when an azido group is introduced. The reaction is likely to proceed through C-H bond activation by an Fe(IV)-oxo species, followed by azido-directed C≡N bond formation. These results offer a unique opportunity to investigate and expand the reaction repertoire of Fe/2OG enzymes.", "enzyme_family": "hydroxylase", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "C-O | C-H", "substrate": "amine | amino acid derivative", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "0.58", "citation_count": "19", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Repurposing Nonheme Iron Hydroxylases To Enable Catalytic Ni...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1021_acs_orglett_3c00940", "title": "Catalytic Enantioselective Amination of Enol Silyl Ethers Using a Chiral Paddle-Wheel Diruthenium Complex.", "authors": "Kotoko Makino, Yuhei Kumagai, Tatsuhiko Yoshino et al.", "year": 2023, "doi": "10.1021/acs.orglett.3c00940", "journal": "Organic Letters", "url": "https://doi.org/10.1021/acs.orglett.3c00940", "abstract": "A chiral paddle-wheel dinuclear ruthenium catalyst was applied to a catalytic asymmetric nitrene-transfer reaction with enol silyl ethers. The ruthenium catalyst was applicable to aliphatic enol silyl ethers as well as aryl-containing enol silyl ethers. The substrate scope of the ruthenium catalyst was superior to that of analogous chiral paddle-wheel rhodium catalysts. α-Amino ketones derived from aliphatic substrates were obtained in up to 97% ee with the ruthenium catalyst, while analogous rhodium catalysts resulted in only moderate enantioselectivity.", "enzyme_family": "no enzyme", "paper_domain": "organic photoredox/radical no-enzyme", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "C-O | C-Si", "substrate": "arene | amine | carbonyl compound", "opportunity": "medium", "hydrolase_relevance": "no obvious relevance", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "0.58", "citation_count": "11", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Catalytic Enantioselective Amination of Enol Silyl Ethers Us...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1002_anie_201402809", "title": "Improved cyclopropanation activity of histidine-ligated cytochrome P450 enables the enantioselective formal synthesis of levomilnacipran.", "authors": "Z. J. Wang, Hans Renata, Nicole E. Peck et al.", "year": 2014, "doi": "10.1002/anie.201402809", "journal": "Angewandte Chemie", "url": "https://doi.org/10.1002/anie.201402809", "abstract": "Abstract Engineering enzymes capable of modes of activation unprecedented in nature will increase the range of industrially important molecules that can be synthesized through biocatalysis. However, low activity for a new function is often a limitation in adopting enzymes for preparative‐scale synthesis, reaction with demanding substrates, or when a natural substrate is also present. By mutating the proximal ligand and other key active‐site residues of the cytochrome P450 enzyme from Bacillus megaterium (P450‐BM3), a highly active His‐ligated variant of P450‐BM3 that can be employed for the enantioselective synthesis of the levomilnacipran core was engineered. This enzyme, BM3‐Hstar, catalyzes the cyclopropanation of N , N ‐diethyl‐2‐phenylacrylamide with an estimated initial rate of over 1000 turnovers per minute and can be used under aerobic conditions. Cyclopropanation activity is highly dependent on the electronic properties of the P450 proximal ligand, which can be used to tune this non‐natural enzyme activity.", "enzyme_family": "P450", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "C-N", "substrate": "other", "opportunity": "medium", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "0.52", "citation_count": "162", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Improved cyclopropanation activity of histidine-ligated cyto...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1021_jacs_8b02769", "title": "Unprecedented Cyclization Catalyzed by a Cytochrome P450 in Benzastatin Biosynthesis.", "authors": "Hayama Tsutsumi, Yohei Katsuyama, M. Izumikawa et al.", "year": 2018, "doi": "10.1021/jacs.8b02769", "journal": "Journal of the American Chemical Society", "url": "https://doi.org/10.1021/jacs.8b02769", "abstract": "Benzastatins have unique structures probably derived from geranylated p-aminobenzoic acids. The indoline and tetrahydroquinoline scaffolds are presumably formed by cyclization of the geranyl moiety, but the cyclization mechanism was unknown. We studied the benzastatin biosynthetic gene cluster of Streptomyces sp. RI18; functions of the six enzymes encoded by it were analyzed by gene disruption in a heterologous host and in vitro enzyme assays. We propose the biosynthetic pathway for benzastatins in which a cytochrome P450 (BezE) is responsible for the cyclization of geranylated p-acetoxyaminobenzoic acids; BezE catalyzes elimination of acetic acid to form an iron nitrenoid, nitrene transfer to form an aziridine ring, and nucleophilic addition of hydroxide ion to C-10 and chloride ion to C-9 to generate the indoline and tetrahydroquinoline scaffolds, respectively. Discovery of this enzyme, which should be termed cytochrome P450 nitrene transferase, provides an important insight into the functional diversity of cytochrome P450.", "enzyme_family": "P450", "paper_domain": "enzymatic non-photo", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "cyclization", "mechanism": "unclear", "bond": "unclear", "substrate": "amine | alkyl halide", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "0.35", "citation_count": "88", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Unprecedented Cyclization Catalyzed by a Cytochrome P450 in ...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1002_cbic_201402286", "title": "Non‐natural Olefin Cyclopropanation Catalyzed by Diverse Cytochrome P450s and Other Hemoproteins", "authors": "Thomas Heel, J. McIntosh, Sheel C. Dodani et al.", "year": 2014, "doi": "10.1002/cbic.201402286", "journal": "ChemBioChem", "url": "https://doi.org/10.1002/cbic.201402286", "abstract": "Abstract Recent work has shown that engineered variants of cytochrome P450 BM3 (CYP102A1) efficiently catalyze non‐natural reactions, including carbene and nitrene transfer reactions. Given the broad substrate range of natural P450 enzymes, we set out to explore if this diversity could be leveraged to generate a broad panel of new catalysts for olefin cyclopropanation (i.e., carbene transfer). Here, we took a step towards this goal by characterizing the carbene transfer activities of four new wild‐type P450s that have different native substrates. All four were active and exhibited a range of product selectivities in the model reaction: cyclopropanation of styrene by using ethyl diazoacetate (EDA). Previous work on P450 BM3 demonstrated that mutation of the axial coordinating cysteine, universally conserved among P450 enzymes, to a serine residue, increased activity for this non‐natural reaction. The equivalent mutation in the selected P450s was found to activate carbene transfer chemistry both in vitro and in vivo. Furthermore, serum albumins complexed with hemin were also found to be efficient in vitro cyclopropanation catalysts.", "enzyme_family": "P450", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "unclear", "substrate": "alkene", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "0.35", "citation_count": "43", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Non‐natural Olefin Cyclopropanation Catalyzed by Diverse Cyt...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1039_d4np00048j", "title": "The role and mechanisms of canonical and non-canonical tailoring enzymes in bacterial terpenoid biosynthesis.", "authors": "Yuya Kakumu, Ayesha Ahmed Chaudhri, Eric J. N. Helfrich", "year": 2025, "doi": "10.1039/d4np00048j", "journal": "Natural product reports (Print)", "url": "https://doi.org/10.1039/d4np00048j", "abstract": "Covering: up to April 2024Terpenoids represent the largest and structurally most diverse class of natural products. According to textbook knowledge, this diversity arises from a two-step biosynthetic process: first, terpene cyclases generate a vast array of mono- and polycyclic hydrocarbon scaffolds with multiple stereocenters from a limited set of achiral precursors, a process extensively studied over the past two decades. Subsequently, tailoring enzymes further modify these complex scaffolds through regio- and stereocontrolled oxidation and other functionalization reactions, a topic of increasing interest in recent years. The resulting highly functionalized terpenoids exhibit a broad spectrum of unique biological activities, making them promising candidates for drug development. Recent advances in genome sequencing technologies along with the development and application of sophisticated genome mining tools have revealed bacteria as a largely untapped resource for the discovery of complex terpenoids. Functional characterization of a limited number of bacterial terpenoid biosynthetic pathways, combined with in-depth mechanistic studies of key enzymes, has begun to reveal the versatility of bacterial enzymatic processes involved in terpenoid modification. In this review, we examine the various tailoring reactions leading to complex bacterial terpenoids. We first discuss canonical terpene-modifying enzymes, that catalyze the functionalization of unactivated C-H bonds, incorporation of diverse functional groups, and oxidative and non-oxidative rearrangements. We then explore non-canonical terpene-modifying enzymes that facilitate oxidative rearrangement, cyclization, isomerization, and dimerization reactions. The increasing number of characterized tailoring enzymes that participate in terpene hydrocarbon scaffold fomation, rather than merely decorating pre-formed scaffolds suggests that a re-evaluation of the traditional two-phase model for terpenoid biosynthesis might be warranted. Finally, we address the potential and challenges of mining bacterial genomes to identify terpene biosynthetic gene clusters and expand the bacterial terpene biosynthetic and chemical space.", "enzyme_family": "Other_enzyme", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "rearrangement/migration", "mechanism": "HAT", "bond": "C-N | C-H", "substrate": "amine | drug-like molecule", "opportunity": "medium", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "8", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: The role and mechanisms of canonical and non-canonical tailo...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1021_acs_chemrev_5c00837", "title": "Metalloenzyme-Catalyzed Radical Reactions Unknown or Uncommon in Native Enzymology.", "authors": "Wenzhen Fu, Liu-Peng Zhao, Yang Yang", "year": 2026, "doi": "10.1021/acs.chemrev.5c00837", "journal": "Chemical Reviews", "url": "https://doi.org/10.1021/acs.chemrev.5c00837", "abstract": "The past decade has witnessed groundbreaking developments in metalloenzyme-catalyzed free radical transformations, which were previously unknown or uncommon in native metalloenzymology. Guided by mechanistic understandings from organic, organometallic, and biochemistry, an array of radical reactions has been developed using various metalloprotein catalysts based on first-row transition metal cofactors including Fe, Co, and Cu. The structural and functional diversity and the readily tunable active-site environment of metalloproteins offer an excellent opportunity to solve the challenging chemo-, regio-, and stereoselectivity problems in radical-mediated transformations facing synthetic chemists. In this Review, we summarize metalloprotein-catalyzed radical reactions based on the reactive intermediates involved, including carbon-centered radicals, nitrogen-centered radicals, oxygen-centered radicals, and metal carbenoids and nitrenoids with radical character. We further survey the reaction mechanism, enzyme engineering strategies, and substrate scope of these metalloprotein-catalyzed radical transformations, providing an overview of the current status of metalloenzymology that is unknown or uncommon in native biochemistry.", "enzyme_family": "Other_enzyme", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "radical chemical reaction", "reaction_type": "other", "mechanism": "HAT", "bond": "unclear", "substrate": "other", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "2", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Metalloenzyme-Catalyzed Radical Reactions Unknown or Uncommo...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1039_d6sc01440b", "title": "Highly stereoselective synthesis of allylic β-lactams via enzymatic C(sp3)–H amidation", "authors": "Nawal Zahra Jafari, Zheyuan Wang, Anwita Chattopadhyay et al.", "year": 2026, "doi": "10.1039/d6sc01440b", "journal": "Chemical Science", "url": "https://doi.org/10.1039/d6sc01440b", "abstract": "β-Lactams are versatile synthons for organic synthesis as well as valuable pharmacophores for drug development. Here, we describe a biocatalytic strategy for the enantioselective synthesis of allylic β-lactams via a hemoprotein-catalyzed intramolecular C(sp3)–H amidation reaction with dioxazolone substrates. Leveraging a stepwise radical mechanism and overriding the typical reactivity of metallonitrenes, this system provides access to a variety of β-lactam products with consistently high enantioselectivity (≥99% ee) by favoring the amination of an allylic C(sp3)-H bond over the more facile functionalization of the adjacent olefin group. This works expands the range of stereoselective strategies for C–N bond formation via C(sp3)–H functionalization and demonstrates the value of new-to-nature biocatalysis to promote chemical transformations not currently accessible through chemocatalysis.", "enzyme_family": "Other_enzyme", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "radical chemical reaction", "reaction_type": "rearrangement/migration", "mechanism": "unclear", "bond": "C-N | C-H", "substrate": "alkene | drug-like molecule", "opportunity": "medium", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "0", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Highly stereoselective synthesis of allylic β-lactams via en...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1016_j_jinorgbio_2025_113207", "title": "Ascorbate-enabled C-H bond amination catalyzed by myoglobin reconstituted with a trifluoromethyl-substituted Iron porphyrin.", "authors": "C. Sonoda, Takashi Hayashi", "year": 2025, "doi": "10.1016/j.jinorgbio.2025.113207", "journal": "Journal of Inorganic Biochemistry", "url": "https://doi.org/10.1016/j.jinorgbio.2025.113207", "abstract": "Nitrogen-containing organic molecules are essential structural motifs in bioactive compounds, pharmaceuticals and functional materials. Direct C-H amination via nitrene transfer provides an efficient and atom-economical route for C-N bond formation. However, most hemoprotein-based catalysts require strong reductants such as dithionite to generate the metal-nitrene intermediate. Here, we report myoglobin reconstituted with an iron complex (FePor(CF₃)₂) bearing two trifluoromethyl groups at the pyrrole β-positions of the porphyrin framework. This arrangement promotes intramolecular benzylic C-H bond amination under mild conditions using sodium l-ascorbate as the sole reductant. The FePor(CF₃)₂ cofactor exhibits a positively shifted Fe(III)/Fe(II) redox potential that allows efficient reduction to occur in the protein scaffold and suppresses noncatalytic substrate reduction, leading to improved chemoselectivity for secondary C-H bond amination. The H64A mutant of myoglobin reconstituted with FePor(CF₃)₂ achieved a turnover number (TON) of 133 for tertiary benzylic C-H amination. Kinetic studies revealed that the reaction rate is inversely correlated with the C-H bond dissociation energy, with a smaller negative slope in the bond dissociation energies (BDEs) plot compared to a synthetic cofactor with a negative redox potential. This suggests that there is a mechanistic shift in the rate-determining step from hydrogen atom transfer to nitrene formation. These findings highlight the potential of cofactor redox tuning to control reactivity and selectivity in artificial heme enzymes for abiological C-H bond functionalization.", "enzyme_family": "Other_enzyme", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "C-N | C-S | C-H", "substrate": "drug-like molecule", "opportunity": "high", "hydrolase_relevance": "no obvious relevance", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "0", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Ascorbate-enabled C-H bond amination catalyzed by myoglobin ...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1039_d5ra01905b", "title": "Enzyme-catalyzed C(sp3)–H aminations for the highly enantioselective construction of chiral 2-oxazolidinones", "authors": "Hanzi Gao, Miao Li, Guojun Zheng", "year": 2025, "doi": "10.1039/d5ra01905b", "journal": "RSC Advances", "url": "https://doi.org/10.1039/d5ra01905b", "abstract": "As a rapidly growing field, C(sp3)–H functionalization is being used to access a wide range of important molecular targets. The enzymatic activity of C(sp3)–H is a powerful synthetic tool to develop valuable building blocks. In this study, engineered myoglobin variants were found to be capable of C(sp3)–H activation under mild conditions via mediated nitrene transfer. Using this approach, 2-oxazolidinones and γ-lactams with high enantioselectivity were obtained through intramolecular cyclization using readily available and stable N-acetoxyamides as substrates.", "enzyme_family": "Other_enzyme", "paper_domain": "enzymatic non-photo", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "cyclization", "mechanism": "unclear", "bond": "C-N", "substrate": "other", "opportunity": "medium", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "0", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Enzyme-catalyzed C(sp3)–H aminations for the highly enantios...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1002_chem_71018", "title": "Enantioselective Intramolecular Benzylic C–H Amination Enabled by Nonheme Iron Catalysis", "authors": "Hua Zhao, Shixin Zheng, Hongbo Guo et al.", "year": 2026, "doi": "10.1002/chem.71018", "journal": "Chemistry – A European Journal", "url": "https://doi.org/10.1002/chem.71018", "abstract": "\n \n The development of asymmetric C(sp\n 3\n )–H amination methodologies employing earth‐abundant metal catalysts is a significant goal in synthetic chemistry. Drawing inspiration from the high selectivity of heme and nonheme iron enzymes in catalyzing C(sp\n 3\n )–H amination reactions, in this study, we describe an efficient and sustainable strategy for constructing chiral imidazolidin‐2‐ones. This process utilizes a readily accessible nonheme iron complex bearing a chiral tetradentate aminopyridine ligand with an octahydro‐1,1'‐biisoquinoline backbone as the catalyst. Under mild conditions, the catalyst enables an enantioselective intramolecular C(sp\n 3\n )–H amination of\n N\n ‐aroyloxy ureas to afford the target chiral heterocycles. The absolute configuration of the synthesized imidazolidin‐2‐ones was unambiguously confirmed by X‐ray diffraction analysis.\n", "enzyme_family": "Other_enzyme", "paper_domain": "enzymatic non-photo", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "unclear", "bond": "unclear", "substrate": "pyridine/heteroarene | amine", "opportunity": "medium", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "0.83", "citation_count": "0", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Enantioselective Intramolecular Benzylic C–H Amination Enabl...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1126_science_aee3321", "title": "Chiral S(VI) platform unifies selective C–H amination of complex molecules and alkane feedstocks", "authors": "T. A. Trinh, Derek B. Hu, Anna J. Kenny et al.", "year": 2026, "doi": "10.1126/science.aee3321", "journal": "Science", "url": "https://doi.org/10.1126/science.aee3321", "abstract": "Complex molecules and simple alkanes pose distinct challenges for catalyst-controlled carbon-hydrogen (C–H) functionalizations. Whereas densely functionalized scaffolds require precise targeting among multiple reactive sites while tolerating sensitive functionalities, unactivated substrates that lack directing groups require selective activation of exceptionally inert, nearly identical C–H bonds. In this work, we addressed both challenges by repurposing a classic chiral auxiliary into a unified, selective, and predictable C–H amination platform mediated by silver catalysis and chiral sulfur(VI) nitrene precursors. This system enables stereodivergent, late-stage aminations of activated C–H bonds with broad functional group tolerance and compatibility with aqueous conditions while also mediating mild, selective aminations of chemical feedstocks. The sulfur(VI) motif functions as a modular, stereodefined, and medicinally relevant synthetic linchpin for rapid library diversification, enabling both target- and diversity-oriented synthesis.", "enzyme_family": "Other_enzyme", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "C-H functionalization", "mechanism": "HAT", "bond": "C-H", "substrate": "other", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "0.58", "citation_count": "1", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_featu
