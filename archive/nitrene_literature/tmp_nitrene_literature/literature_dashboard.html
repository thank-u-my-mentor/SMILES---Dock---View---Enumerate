<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Literature Dashboard</title>
  <style>
    :root {
      --bg: #f7f7f4; --panel: #ffffff; --ink: #202326; --muted: #667078;
      --line: #d9ddd8; --blue: #356a88; --green: #48735c; --amber: #9a6b2f;
      --red: #9b4b45; --chip: #eef1ed;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); }
    header { padding: 18px 24px 14px; border-bottom: 1px solid var(--line); background: #fff; position: sticky; top: 0; z-index: 5; }
    h1 { margin: 0 0 10px; font-size: 24px; font-weight: 700; }
    .controls { display: grid; grid-template-columns: 1.5fr repeat(4, minmax(150px, 1fr)); gap: 10px; }
    input, select { width: 100%; border: 1px solid var(--line); background: #fff; padding: 9px 10px; border-radius: 6px; font-size: 14px; }
    main { display: grid; grid-template-columns: minmax(380px, 0.95fr) minmax(440px, 1.05fr); gap: 16px; padding: 16px 24px 24px; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 13px; }
    .stat { background: var(--chip); padding: 5px 8px; border-radius: 6px; }
    .list { display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 150px); overflow: auto; padding-right: 4px; }
    .paper { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; }
    .paper.active { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(53,106,136,.12); }
    .title { font-weight: 700; line-height: 1.35; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { background: var(--chip); border-radius: 999px; padding: 3px 7px; font-size: 12px; }
    .chip.high { color: #fff; background: var(--green); }
    .chip.other { color: #fff; background: var(--amber); }
    .chip.bad { color: #fff; background: var(--red); }
    .detail { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 320px; padding: 16px; }
    .detail h2 { margin: 0 0 8px; font-size: 20px; }
    .kv { display: grid; grid-template-columns: 150px 1fr; gap: 8px 12px; font-size: 14px; margin-top: 14px; }
    .kv div:nth-child(odd) { color: var(--muted); }
    .abstract { margin-top: 14px; line-height: 1.55; color: #303438; white-space: pre-wrap; }
    .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
    button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
    button.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    #network { width: 100%; height: 420px; border: 1px solid var(--line); border-radius: 8px; background: #fbfbf9; }
    .hidden { display: none; }
    @media (max-width: 980px) { main { grid-template-columns: 1fr; } .controls { grid-template-columns: 1fr 1fr; } .list { max-height: 520px; } }
  </style>
</head>
<body>
  <header>
    <h1>Literature Dashboard</h1>
    <div class="controls">
      <input id="q" placeholder="搜索标题、DOI、摘要、关键词">
      <select id="zotero"></select>
      <select id="domain"></select>
      <select id="family"></select>
      <select id="reaction"></select>
      <select id="priority"></select>
      <select id="fieldMatch"></select>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main>
    <section>
      <div class="list" id="list"></div>
    </section>
    <section>
      <div class="tabs">
        <button id="tabDetail" class="active">文献详情</button>
        <button id="tabNetwork">引文网络</button>
      </div>
      <div id="detail" class="detail"></div>
      <div id="networkPanel" class="hidden">
        <canvas id="network"></canvas>
        <div class="meta">圆点大小按引用数；蓝色为种子，绿色为发现文献。点击节点会尝试匹配详情。</div>
      </div>
    </section>
  </main>

ering enzymes to catalyze reactions not found in nature. We begin with examples of how nature has discovered new catalytic functions and how such evolutionary progressions have been recapitulated in the laboratory starting from extant enzymes. We then examine non-native enzyme activities that have been discovered and exploited for chemical synthesis, emphasizing reactions that do not have natural counterparts. The new functions have mechanistic parallels to the native reaction mechanisms that often manifest as catalytic promiscuity and the ability to convert from one function to the other with minimal mutation. We present examples of how non-natural activities have been improved by directed evolution, mimicking the process used by nature to create new catalysts. Examples of new enzyme functions include epoxide opening reactions with non-natural nucleophiles catalyzed by a laboratory-evolved halohydrin dehalogenase, cyclopropanation and other carbene transfer reactions catalyzed by cytochrome P450 variants, and non-natural modes of cyclization by a modified terpene synthase. Lastly, we describe discoveries of non-native catalytic functions that may provide future opportunities for expanding the enzyme universe.", "enzyme_family": "P450", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "cyclization", "mechanism": "HAT", "bond": "C-N", "substrate": "amine", "opportunity": "high", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "454", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: Expanding the Enzyme Universe: Accessing Non-Natural Reactio...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1021_cs400893n", "title": "P450-Catalyzed Intramolecular sp3 C–H Amination with Arylsulfonyl Azide Substrates", "authors": "Ritesh Singh, Mélanie Bordeaux, R. Fasan", "year": 2014, "doi": "10.1021/cs400893n", "journal": "ACS Catalysis", "url": "https://doi.org/10.1021/cs400893n", "abstract": "The direct amination of aliphatic C–H bonds represents a most valuable transformation in organic chemistry. While a number of transition-metal-based catalysts have been developed and investigated for this purpose, the possibility to execute this transformation with biological catalysts has remained largely unexplored. Here, we report that cytochrome P450 enzymes can serve as efficient catalysts for mediating intramolecular benzylic C–H amination reactions in a variety of arylsulfonyl azide compouds. Under optimized conditions, the P450 catalysts were found to support up to 390 total turnovers leading to the formation of the desired sultam products with excellent regioselectivity. In addition, the chiral environment provided by the enzyme active site allowed for the reaction to proceed in a stereo- and enantioselective manner. The C–H amination activity, substrate profile, and enantio/stereoselectivity of these catalysts could be modulated by utilizing enzyme variants with engineered active sites.", "enzyme_family": "P450", "paper_domain": "photoenzymatic/enzymatic", "search_track": "N/A", "photoenzymatic_application_status": "N/A", "new_to_nature_reaction": "N/A", "flavin_cofactor": "N/A", "characterized_enzyme_evidence": "N/A", "candidate_for_photoenzyme_repurposing": "N/A", "structure_similarity_hint": "N/A", "topic_domain": "other", "reaction_type": "other", "mechanism": "HAT", "bond": "unclear", "substrate": "arene", "opportunity": "medium", "hydrolase_relevance": "stereocontrol analogy", "review_priority": "medium", "zotero_status": "new_discovery", "metadata_keywords": "unclear", "relevance_score": "1.00", "citation_count": "164", "discovery_depth": "1", "criteria_status": "", "criteria_score": "", "criteria_missing": "", "field_match_status": "", "criteria_field_hits": "", "criteria_enzyme_feature_hits": "", "criteria_reaction_hits": "", "key_innovation": "基于标题推断: P450-Catalyzed Intramolecular sp3 C–H Amination with Arylsul...", "limitation": "需LLM进一步提取", "future_direction": "需LLM进一步提取"}, {"id": "10_1021_cs5018612", "title": "Enzymatic C(sp3)-H Amination: P450-Catalyzed Conversion of Carbonazidates into Oxazolidinones", "authors": "Ritesh Singh, Joshua N. Kolev, Philip A. Sutera et al.", "year": 2015, "doi": "10.1021/cs5018612", "journal": "ACS Catalysis", "url": "https://doi.org/10.1021/cs5018612", "abstract": "Cytochrome P450 enzymes can effectively promote the activation and cyclization of carbonazidate substrates to yield oxazolidinones via an intramolecular nitrene C–H insertion reaction. Investigation of the substrate scope shows that while benzylic/allylic C–H bonds are most readily aminated by these biocatalysts, stronger, secondary C–H bonds are also accessible to functionalization. Leveraging this “non-native” reactivity and assisted by fingerprint-based predictions, improved active-site variants of the bacterial P450 CYP102A1 could be identified to mediate the aminofunctionalization of two terpene natural products with high regio- and stereoselectivity. Mechanistic studies and KIE experiments show that the C–H activation step in these reactions is rate-limiting and proceeds in a stepwise manner, namely, via hydrogen atom abstraction followed by radical recombination. This study expands the reactivity scope of P450-based catalysts in the context of nitrene transfer transformations and provides first-time insights into the mechanism of P450-catalyzed C–H amination rea
